<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Login | DevSpace</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); font-family: 'Space Grotesk', sans-serif; }
    .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px; text-align: center; }
    .login-card h1 { font-size: 1.5rem; margin-bottom: 0.3rem; }
    .login-card .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 2rem; }
    .login-card .logo-text { color: var(--accent); font-size: 2rem; font-weight: 700; margin-bottom: 1.5rem; }
    .login-card input { width: 100%; padding: 0.85rem 1rem; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: inherit; font-size: 0.95rem; outline: none; margin-bottom: 1rem; transition: border-color 0.2s; box-sizing: border-box; }
    .login-card input:focus { border-color: var(--accent); }
    .login-card button { width: 100%; padding: 0.85rem; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .login-card button:hover { opacity: 0.85; }
    .error-msg { color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .back-link { display: block; margin-top: 1.2rem; color: var(--text-secondary); font-size: 0.85rem; text-decoration: none; }
    .back-link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-text">D<span style="color:var(--text)">evSpace</span></div>
    <h1>Dashboard</h1>
    <p class="subtitle">Sign in to view contact messages</p>
    <div class="error-msg" id="errorMsg">Invalid email or password</div>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email address" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Sign In</button>
    </form>
    <a href="index.html" class="back-link">← Back to Portfolio</a>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/dashboard.html';
        } else {
          errEl.style.display = 'block';
          errEl.textContent = data.error || 'Invalid credentials';
        }
      } catch (err) {
        errEl.style.display = 'block';
        errEl.textContent = 'Connection error. Try again.';
      }
    });
  </script>
</body>
</html>
